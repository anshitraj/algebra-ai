<text x="604" y="401" font-size="15.5" font-weight="700" fill="#085041">Economic coordinator</text>
<text x="604" y="424" font-size="13.5" fill="#2C2C2A">intent → reserve → begin → authorize → complete → reconcile</text>
<text x="604" y="443" font-size="13.5" fill="#2C2C2A">One live attempt per outcome, enforced by Postgres: never pays twice</text>
<rect x="1083" y="383" width="24" height="22" rx="11" fill="#2C2C2A"/><text x="1095" y="398.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
