<text x="604" y="920" font-size="13.5" fill="#2C2C2A">Unused pulls refunded</text>
<rect x="868" y="803" width="24" height="22" rx="11" fill="#2C2C2A"/><text x="880" y="818.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
