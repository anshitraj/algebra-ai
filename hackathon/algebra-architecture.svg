<circle cx="71" cy="952" r="9.5" fill="#2C2C2A"/><text x="71" y="956.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<text x="90" y="957" font-size="13.5" fill="#2C2C2A">Settlement proven from chain; signed receipt back</text>
<text x="40" y="1032" font-size="15" font-weight="600" fill="#2C2C2A">Give agents permission to spend, not access to money.</text>
<text x="40" y="1056" font-size="13" fill="#5F5E5A">Demo accounts pay only in the sandbox. Every limit is checked again right before the wallet signs.</text>
