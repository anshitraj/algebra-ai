<text x="1184" y="456" font-size="15.5" font-weight="700" fill="#0C447C">Paid API providers (x402)</text>
<text x="1184" y="479" font-size="13.5" fill="#2C2C2A">Token price · token risk · search · LLM …</text>
<text x="1184" y="498" font-size="13.5" fill="#2C2C2A">Ask: HTTP 402 with a price</text>
<text x="1184" y="517" font-size="13.5" fill="#2C2C2A">Pay: a signed USDC transfer</text>
<text x="1184" y="536" font-size="13.5" fill="#2C2C2A">Answer: treated as untrusted data</text>
<rect x="1512" y="438" width="40" height="22" rx="11" fill="#2C2C2A"/><text x="1532" y="453.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4 7</text>
