<text x="604" y="315" font-size="13.5" fill="#2C2C2A">Rule for never-paid providers</text>
<text x="604" y="334" font-size="13.5" fill="#2C2C2A">Kill switch · dry run</text>
<rect x="813" y="198" width="24" height="22" rx="11" fill="#2C2C2A"/><text x="825" y="213.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
