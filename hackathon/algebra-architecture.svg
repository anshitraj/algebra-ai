<text x="40" y="62" font-size="28" font-weight="700" fill="#2C2C2A">Algebra · architecture</text>
<text x="40" y="94" font-size="16" fill="#5F5E5A">The router and spend firewall for AI agents that pay for APIs on Solana</text>
