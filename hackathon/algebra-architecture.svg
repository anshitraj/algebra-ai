<text x="874" y="258" font-size="13.5" fill="#2C2C2A">Free unpaid 402 quotes</text>
<text x="874" y="277" font-size="13.5" fill="#2C2C2A">Guards drop down, overpriced</text>
<text x="874" y="296" font-size="13.5" fill="#2C2C2A">and trap-priced providers</text>
