<text x="60" y="775" font-size="17" font-weight="700" fill="#2C2C2A">One paid request</text>
<circle cx="71" cy="798" r="9.5" fill="#2C2C2A"/><text x="71" y="802.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="90" y="803" font-size="13.5" fill="#2C2C2A">Agent asks: work, input, max price (REST or MCP)</text>
<circle cx="71" cy="820" r="9.5" fill="#2C2C2A"/><text x="71" y="824.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="90" y="825" font-size="13.5" fill="#2C2C2A">Spend firewall checks the pass: allow, ask you, deny</text>
<circle cx="71" cy="842" r="9.5" fill="#2C2C2A"/><text x="71" y="846.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="90" y="847" font-size="13.5" fill="#2C2C2A">Router gathers candidates: catalogs by class, web</text>
<circle cx="71" cy="864" r="9.5" fill="#2C2C2A"/><text x="71" y="868.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="90" y="869" font-size="13.5" fill="#2C2C2A">Free 402 quotes; guards drop bad ones; rank</text>
<circle cx="71" cy="886" r="9.5" fill="#2C2C2A"/><text x="71" y="890.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="90" y="891" font-size="13.5" fill="#2C2C2A">Coordinator reserves one attempt (never twice)</text>
<circle cx="71" cy="908" r="9.5" fill="#2C2C2A"/><text x="71" y="912.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
