<text x="604" y="511" font-size="15.5" font-weight="700" fill="#085041">Receipts and replay</text>
<text x="604" y="534" font-size="13.5" fill="#2C2C2A">Ed25519-signed receipt</text>
<text x="604" y="553" font-size="13.5" fill="#2C2C2A">Anyone verifies: /verify, JWKS</text>
<text x="604" y="572" font-size="13.5" fill="#2C2C2A">Answer kept sealed for 24 h</text>
<rect x="813" y="493" width="24" height="22" rx="11" fill="#2C2C2A"/><text x="825" y="508.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
