# /etc/algebra/api.conf: the API's settings that are not secret. Read by algebra-api-start (a
# shell sources it, so quote values with spaces). The secrets are in /run/algebra/api.env.
APP_ENV=production
HTTP_ADDR=127.0.0.1:8080
# The web app lives at this address (Vercel); the API only accepts changes from it.
PUBLIC_WEB_URL=https://www.usealgebra.xyz
CORS_ALLOWED_ORIGINS=https://www.usealgebra.xyz,https://usealgebra.xyz,https://algebra-ai-dun.vercel.app
ENABLED_MERCHANTS=none
# Requests arrive through Cloudflare's tunnel: one proxy that writes the client address.
TRUSTED_PROXY_HOPS=1
ALGEBRA_DATA_DIR=/var/lib/algebra
EMAIL_FROM='Algebra <no-reply@auth.usealgebra.xyz>'
# People sign in with an emailed code.
PASSWORD_LOGIN=off
# "Try the demo" accounts pay simulated USDC in the sandbox.
ECONOMIC_SANDBOX=on
# Devnet only: Algebra makes its own payer key on first start and keeps it sealed in the database
# (under the master key). It needs devnet SOL and USDC: docs/SIGNER.md.
SOLANA_DEVNET_SIGNER=generated
# Mainnet stays off: no SOLANA_MAINNET_*, SOLANA_ALLOW_MAINNET or MAINNET_EXECUTION.
