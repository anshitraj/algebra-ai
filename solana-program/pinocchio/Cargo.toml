[package]
name = "spend-pass-pinocchio"
version = "0.1.0"
description = "Algebra Spend Pass, rewritten on Pinocchio: the same instructions, accounts and errors as programs/spend-pass, in a much smaller program"
edition = "2021"
publish = false

# Its own workspace, so the Anchor program's workspace and lockfile are untouched.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "spend_pass_pinocchio"

[features]
no-entrypoint = []

[dependencies]
pinocchio = { version = "0.11.2", default-features = false, features = ["cpi", "copy", "sha2"] }
pinocchio-token = "0.7.0"
pinocchio-system = "0.6.1"
pinocchio-associated-token-account = "0.4.0"
pinocchio-log = "0.5.1"

[dev-dependencies]
# The Anchor program's own instruction builders and account type, used to
# drive this program in the tests: if both accept the same bytes, the
# backend can switch between them by program id alone.
spend-pass = { path = "../programs/spend-pass", features = ["no-entrypoint"] }
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "4.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
