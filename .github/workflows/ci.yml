name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go) fmt / vet / build / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod # the toolchain the module asks for: the one that ships
          cache: true
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (unit — no external dependencies)
        run: go test ./... -race -count=1

  integration:
    name: Backend integration + end-to-end (Postgres, Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algebra
          POSTGRES_PASSWORD: algebra
          POSTGRES_DB: algebra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algebra -d algebra_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod # the toolchain the module asks for: the one that ships
          cache: true
          cache-dependency-path: backend/go.sum
      # What the money invariants are checked against: the Postgres repositories (one live
      # attempt and one commitment per outcome, the job and pass limits under the pass's row
      # lock), and the real API over HTTP and MCP against the sandbox sellers. Without
      # DATABASE_URL these skip themselves, so the unit job above never ran them.
      - name: go test (Postgres repositories and the end-to-end flows over HTTP and MCP)
        env:
          DATABASE_URL: postgres://algebra:algebra@localhost:5432/algebra_test?sslmode=disable
          REDIS_ADDR: localhost:6379
        run: |
          # A throwaway key: 32 random bytes, base64 (docs/LOCAL_DEVELOPMENT.md).
          export ALGEBRA_MASTER_KEY="$(openssl rand -base64 32)"
          go test ./... -count=1 -p 1 -timeout 20m

  vulnerabilities:
    name: Vulnerability scan (Go, npm, Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reachable vulnerabilities in the standard library and the modules, for the
      # toolchain go.mod asks for: when a patched Go ships, this fails until go.mod
      # names it, so a fix is never one a deploy silently misses.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # What the production build ships to the browser and runs on the server.
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
        with:
          package_json_file: frontend/package.json
      - name: pnpm audit (production dependencies)
        working-directory: frontend
        run: pnpm audit --prod
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit (the Spend Pass program's crates)
        working-directory: solana-program
        run: |
          cargo install cargo-audit --locked
          cargo audit

  security:
    name: Security checks (no secret leakage in logs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod # the toolchain the module asks for: the one that ships
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run redaction + audit-forbidden-key tests specifically
        run: |
          go test ./internal/platform/logging/... -run TestSensitiveValuesNeverAppearInLogOutput -v
          go test ./internal/domain/audit/... -run TestValidate_RejectsSecretLookingKeys -v

      - name: Check for accidentally committed .env
        run: |
          if [ -f .env ] || [ -f ../frontend/.env.local ]; then
            echo "An env file is committed — this must never happen."
            exit 1
          fi

  migrations:
    name: Migration validation (applies cleanly to a fresh Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algebra
          POSTGRES_PASSWORD: algebra
          POSTGRES_DB: algebra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algebra -d algebra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod # the toolchain the module asks for: the one that ships
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://algebra:algebra@localhost:5432/algebra?sslmode=disable
        run: |
          # The helper has to sit inside the module: Go refuses an internal/ import
          # from a file outside it ("use of internal package ... not allowed").
          mkdir -p cmd/migratecheck
          cat <<'EOF' > cmd/migratecheck/main.go
          package main

          import (
          	"context"
          	"log"
          	"os"

          	"github.com/project-algebra/algebra/internal/platform/postgres"
          )

          func main() {
          	db, err := postgres.Connect(context.Background(), os.Getenv("DATABASE_URL"))
          	if err != nil {
          		log.Fatal(err)
          	}
          	defer db.Close()
          	if err := db.Migrate(context.Background(), "migrations"); err != nil {
          		log.Fatal(err)
          	}
          }
          EOF
          go run ./cmd/migratecheck

  frontend:
    name: Frontend lint / typecheck / production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches frontend/Dockerfile
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # The logic the pages rely on (cross-checks, routing, the wallet's maths...).
      - run: node --experimental-strip-types --test scripts/*.test.mjs
      # The rewrite to the API is baked in at build time (see frontend/Dockerfile);
      # any URL works for a compile check.
      - run: pnpm build
        env:
          ALGEBRA_API_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"
      # The built server, as the image runs it, next to a stub of the API: every
      # page renders, the security headers and CSP are sent (a dev server sends
      # neither), the console is closed without a session, the rewrites reach the API.
      - run: pnpm smoke
        env:
          ALGEBRA_API_URL: http://localhost:8080

  program:
    name: Spend Pass program (Rust) unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-program
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Every limit the program enforces, on the host. The LiteSVM tests run the
      # built program and need `cargo build-sbf` first (docs/SPEND_PASS_PROGRAM.md).
      - run: cargo test --locked --lib

  docker:
    name: Docker images build (backend API, frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -t algebra-api backend
      - name: Frontend image
        run: docker build -t algebra-web --build-arg ALGEBRA_API_URL=http://localhost:8080 frontend
