name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go fmt / vet / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (unit — no external dependencies)
        run: go test ./... -race -count=1

  security:
    name: Security checks (no secret leakage in logs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run redaction + audit-forbidden-key tests specifically
        run: |
          go test ./internal/platform/logging/... -run TestSensitiveValuesNeverAppearInLogOutput -v
          go test ./internal/domain/audit/... -run TestValidate_RejectsSecretLookingKeys -v

      - name: Check for accidentally committed .env
        run: |
          if [ -f .env ]; then
            echo "A .env file is committed — this must never happen."
            exit 1
          fi

  migrations:
    name: Migration validation (applies cleanly to a fresh Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algebra
          POSTGRES_PASSWORD: algebra
          POSTGRES_DB: algebra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algebra -d algebra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://algebra:algebra@localhost:5432/algebra?sslmode=disable
        run: |
          # The helper has to sit inside the module: Go refuses an internal/ import
          # from a file outside it ("use of internal package ... not allowed").
          mkdir -p cmd/migratecheck
          cat <<'EOF' > cmd/migratecheck/main.go
          package main

          import (
          	"context"
          	"log"
          	"os"

          	"github.com/project-algebra/algebra/internal/platform/postgres"
          )

          func main() {
          	db, err := postgres.Connect(context.Background(), os.Getenv("DATABASE_URL"))
          	if err != nil {
          		log.Fatal(err)
          	}
          	defer db.Close()
          	if err := db.Migrate(context.Background(), "migrations"); err != nil {
          		log.Fatal(err)
          	}
          }
          EOF
          go run ./cmd/migratecheck

  web:
    name: Web lint / typecheck / production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches web/Dockerfile
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # The rewrite to the API is baked in at build time (see web/Dockerfile);
      # any URL works for a compile check.
      - run: pnpm build
        env:
          ALGEBRA_API_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"
